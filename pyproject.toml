[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blacklist-detect"
version = "0.1.4"
description = "Windows desktop check for blacklisted names on the 12-player lobby."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "numpy",
  "Pillow",
  "paddleocr>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
blacklist-detect = "blacklist_detect.__main__:main"

[tool.setuptools.packages.find]
include = ["blacklist_detect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = ["dist", "HunyuanOCR", "_crops"]

[tool.ruff.lint]
# Syntax errors, pyflakes (unused or undefined names), import order, and common bug patterns.
select = ["E9", "F", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["blacklist_detect"]

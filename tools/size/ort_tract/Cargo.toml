# tract (pure Rust ONNX) measured as an alternative to ONNX Runtime: tools/size/ort_build.txt. Not part of the app.
[package]
name = "ort-tract-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["tract"]
# Without it the binary is the same probe minus tract: the size tract adds is the difference.
tract = ["dep:tract-onnx"]

[dependencies]
serde_json = "1"
tract-onnx = { version = "=0.23.10", optional = true }

[profile.release]
strip = true
lto = true
codegen-units = 1

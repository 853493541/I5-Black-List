name: tests

# The Python app's suite: only for pushes that touch the Python app, its tests or tools (not the Rust work).
on:
  push:
    paths:
      - "blacklist_detect/**"
      - "tests/**"
      - "tools/**"
      - "!tools/rust_*"
      - "build/**"
      - "!build/make_rust_release.py"
      - "*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "blacklist_detect/**"
      - "tests/**"
      - "tools/**"
      - "!tools/rust_*"
      - "build/**"
      - "!build/make_rust_release.py"
      - "*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"

# Many branches push at once: a newer push to a branch cancels its older run instead of queueing behind it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        # The same versions as the shipped runtime, so CI tests what friends run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        # The tests take a minute or two; a hang fails here, after its stacks are printed,
        # instead of at the job's 20-minute limit.
        timeout-minutes: 8
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          PYTHONFAULTHANDLER: "1"
        # The OCR reference tests skip here: Paddle and its models are too large for every push.
        run: python -m pytest -q -rs

name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The same versions as the shipped runtime, so CI tests what friends run.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
          PYTHONFAULTHANDLER: "1"
        # The OCR reference tests skip here: Paddle and its models are too large for every push.
        run: python -m pytest -q -rs

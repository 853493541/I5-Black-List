name: rust

# The Rust rewrite (rust/): build, test and lint the whole workspace. The Windows job is where the
# Windows-only code (rust/win: capture, hotkeys, single instance, autostart) actually runs, and where the OCR is
# linked statically to OpenCV 4.10 built with Intel IPP (the same pixels as the Python app's opencv wheel): the
# IPP tests of rust/ocr run there on golden data that tools/rust_golden_ipp.py makes from made-up names.
on:
  push:
    branches: ["feature/rust*", "fix/rust-scenes-real"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust.yml", "tools/rust_golden_ipp.py"]

# Many branches push at once: a newer push to a branch cancels its older run instead of queueing behind it.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      OPENCV_VERSION: "4.10.0"
      # Images with Visual Studio 18 (MSVC 14.52) ship an STL that rejects the runner's older libclang, which the
      # opencv crate parses headers with ("STL1000: expected Clang 22"); harmless elsewhere.
      OPENCV_CLANG_ARGS: -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libopencv-dev clang libclang-dev mesa-vulkan-drivers libvulkan1 \
            libfontconfig1-dev libxkbcommon-dev

      # OpenCV 4.10 built static, with Intel IPP (ippicv + ippiw, the same IPP opencv-python 4.10 uses) and the static C
      # runtime (/MT), so the exe linked with +crt-static imports only system DLLs (build/make_rust_release.py checks).
      # The official Windows pack ships only opencv_world4100.dll and its import library, so it is built here, cached.
      - name: Cache OpenCV (Windows)
        if: runner.os == 'Windows'
        id: opencv-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\opencv-static
          key: opencv-${{ env.OPENCV_VERSION }}-static-ipp-mt-v1
      # vcvars64 only inside this cmd step: a dev-cmd environment left for later steps (VCINSTALLDIR) makes rustc take
      # link.exe from PATH, where bash finds Git's /usr/bin/link first.
      - name: Build OpenCV static (Windows)
        if: runner.os == 'Windows' && steps.opencv-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          python -m pip install -q ninja || exit /b 1
          curl -sSfL -o opencv.tar.gz "https://github.com/opencv/opencv/archive/refs/tags/%OPENCV_VERSION%.tar.gz" || exit /b 1
          tar xzf opencv.tar.gz || exit /b 1
          cmake -S "opencv-%OPENCV_VERSION%" -B cvbuild -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=C:/opencv-static -DBUILD_SHARED_LIBS=OFF -DBUILD_WITH_STATIC_CRT=ON ^
            -DBUILD_LIST=core,imgproc,imgcodecs -DWITH_IPP=ON -DBUILD_IPP_IW=ON ^
            -DWITH_ITT=OFF -DWITH_OPENCL=OFF -DWITH_EIGEN=OFF -DWITH_LAPACK=OFF -DWITH_PROTOBUF=OFF -DWITH_ADE=OFF ^
            -DWITH_TIFF=OFF -DWITH_WEBP=OFF -DWITH_OPENJPEG=OFF -DWITH_JASPER=OFF -DWITH_OPENEXR=OFF -DWITH_AVIF=OFF ^
            -DWITH_FFMPEG=OFF -DWITH_DSHOW=OFF -DWITH_MSMF=OFF -DWITH_DIRECTX=OFF -DWITH_WIN32UI=OFF ^
            -DBUILD_PNG=ON -DBUILD_JPEG=ON -DBUILD_ZLIB=ON ^
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_opencv_apps=OFF ^
            -DBUILD_JAVA=OFF -DBUILD_opencv_python3=OFF -DBUILD_opencv_python2=OFF > cmake.log || (type cmake.log & exit /b 1)
          findstr /i /c:"IPP" /c:"CPU/HW" /c:"C++ flags (Release)" cmake.log
          cmake --build cvbuild --target install || exit /b 1
          dir /s /b C:\opencv-static\*.lib
      - uses: actions/cache/save@v4
        if: runner.os == 'Windows' && steps.opencv-cache.outputs.cache-hit != 'true'
        with:
          path: C:\opencv-static
          key: opencv-${{ env.OPENCV_VERSION }}-static-ipp-mt-v1
      - name: Point the opencv crate at it (Windows)
        if: runner.os == 'Windows'
        run: |
          libdir=$(dirname "$(find /c/opencv-static -name 'opencv_core*.lib' | head -1)")
          libs=$(ls "$libdir" | sed -n 's/\.lib$//p' | paste -sd, -)
          {
            echo "OPENCV_LINK_LIBS=$libs"
            echo "OPENCV_LINK_PATHS=$(cygpath -w "$libdir")"
            echo 'OPENCV_INCLUDE_PATHS=C:\opencv-static\include'
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
            echo 'RUSTFLAGS=-C target-feature=+crt-static'
          } | tee -a "$GITHUB_ENV"

      # Golden data from the Python side (opencv-python 4.10 with IPP), and onnxruntime.dll for ort's load-dynamic.
      - name: Python reference and golden data
        working-directory: .
        run: |
          python -m pip install -q numpy==2.3.5 Pillow==12.1.0 opencv-python-headless==4.10.0.84 onnxruntime==1.32.0
          mkdir -p "$RUNNER_TEMP/appdata"
          APPDATA="$RUNNER_TEMP/appdata" HOME="$RUNNER_TEMP/appdata" PYTHONPATH=. \
            python tools/rust_golden_ipp.py --out "$RUNNER_TEMP/ipp-golden"
          ort=$(python -c "import onnxruntime, os, glob; d = os.path.join(os.path.dirname(onnxruntime.__file__), 'capi'); print(sorted(glob.glob(os.path.join(d, '*onnxruntime.dll')) + glob.glob(os.path.join(d, 'libonnxruntime.so*')))[0])")
          {
            echo "REC_ORT_LIB=$ort"
            echo "OCR_ORT_LIB=$ort"
            echo "ORT_DYLIB_PATH=$ort"
          } >> "$GITHUB_ENV"
          # Windows only: Ubuntu's OpenCV 4.6 draws 71 of the 400 fillPoly masks differently (rust/ocr/README.md), and
          # its IPP-less INTER_CUBIC matched opencv-python's IPP-off resize on every strip on one CPU but not on the
          # runner's (16 of 240 differ), so the Linux job keeps skipping these.
          if [ "$RUNNER_OS" = Windows ]; then
            {
              echo "REC_GOLDEN=$RUNNER_TEMP/ipp-golden/strips.json"
              echo "REC_CROPS=$RUNNER_TEMP/ipp-golden/crops"
              echo "FILLPOLY_GOLDEN=$RUNNER_TEMP/ipp-golden/fillpoly.json"
            } >> "$GITHUB_ENV"
          fi

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ matrix.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ matrix.os }}-
      - name: OCR against the Python reference
        run: |
          cargo test -p ocr -- --nocapture 2>&1 | tee "$RUNNER_TEMP/ocr.log"
          echo '--- OCR summary'
          grep -E 'IPP in use|skipped|^test .*(ipp|fill_poly|byte_for_byte)|test result' "$RUNNER_TEMP/ocr.log"
      - name: Release build of the app (Windows)
        if: runner.os == 'Windows'
        run: |
          # Only the app's exe ships (no helper bins or examples); its .pdb is a separate artifact, for crash dumps.
          cargo build --release -p app --bin blacklist-detect
          mkdir -p "$RUNNER_TEMP/app" "$RUNNER_TEMP/pdb"
          cp target/release/blacklist-detect.exe "$RUNNER_TEMP/app/"
          cp target/release/blacklist_detect.pdb "$RUNNER_TEMP/pdb/"
          size() { stat -c %s "$2" | awk -v f="$1" '{ printf "| %s | %d | %.1f |\n", f, $1, $1 / 1048576 }'; }
          {
            echo '### Release sizes'
            echo '| File | Bytes | MiB |'
            echo '|---|---|---|'
            for exe in "$RUNNER_TEMP"/app/*.exe; do size "$(basename "$exe")" "$exe"; done
            size onnxruntime.dll "$REC_ORT_LIB"
          } > "$RUNNER_TEMP/app/sizes.md"
          cat "$RUNNER_TEMP/app/sizes.md" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: app-windows-release
          path: ${{ runner.temp }}/app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: app-windows-pdb
          path: ${{ runner.temp }}/pdb
      # The exe may import only DLLs a clean Windows 10 has (build/make_rust_release.py: SYSTEM_DLLS).
      - name: Import tables (Windows)
        if: runner.os == 'Windows'
        working-directory: .
        run: |
          PYTHONPATH=. APPDATA="$RUNNER_TEMP/appdata" python - "$RUNNER_TEMP"/app/*.exe <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          from pathlib import Path
          sys.path.insert(0, "build")
          from make_rust_release import foreign_imports, pe_imports
          bad = 0
          for exe in map(Path, sys.argv[1:]):
              foreign = foreign_imports(exe)
              print(f"- {exe.name}: imports {', '.join(pe_imports(exe.read_bytes()) or [])}; not a system DLL: {foreign or 'none'}")
              bad += bool(foreign)
          sys.exit(bad)
          PY
      - name: Test
        run: cargo test --workspace
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Last, so it ends the log: which OCR parity tests ran against which OpenCV, and the release sizes.
      - name: Recap
        if: always()
        run: |
          grep -hE 'IPP in use|skipped|^test .*(ipp|fill_poly|byte_for_byte)|test result' "$RUNNER_TEMP/ocr.log" || true
          cat "$RUNNER_TEMP/app/sizes.md" 2>/dev/null || true

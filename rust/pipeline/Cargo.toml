[package]
name = "pipeline"
version = "0.1.0"
edition.workspace = true

[dependencies]
lobby = { path = "../lobby" }
ocr = { path = "../ocr" }
opencv = { version = "0.102", default-features = false, features = ["imgproc", "imgcodecs"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "std"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[lints]
workspace = true

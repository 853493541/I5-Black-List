[package]
name = "stage"
version = "0.1.0"
edition.workspace = true

[dependencies]
scenes = { path = "../scenes" }
lobby = { path = "../lobby" }
# DX12 only on Windows (WARP, its software adapter, is part of it) and WGSL shaders only; Vulkan and GL for the
# Linux tests (rust/README.md: size).
wgpu = { version = "25", default-features = false, features = ["dx12", "wgsl"] }
pollster = "0.4"
bytemuck = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(windows))'.dependencies]
wgpu = { version = "25", default-features = false, features = ["vulkan", "gles"] }

[lints]
workspace = true

[package]
name = "overlay"
version = "0.1.0"
edition.workspace = true
description = "The marks drawn on the game over the 黑名单 and 嘉宾 seats (ui_overlay.py), and the layered window that shows them."

[dependencies]
tiny-skia = "0.11"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true

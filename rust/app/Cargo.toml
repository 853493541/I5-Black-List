[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "settings-mock"
path = "src/main.rs"

[dependencies]
slint = { version = "1.14", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
] }
png = "0.17"
caseless = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
data = { path = "../data" }
lobby = { path = "../lobby" }
pinyin = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"

[build-dependencies]
slint-build = "1.14"

[lints]
workspace = true

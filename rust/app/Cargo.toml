[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "blacklist-detect"
path = "src/main.rs"

[[bin]]
name = "settings-mock"
path = "src/bin/settings_mock.rs"

[features]
default = []
# The Rust preview (docs/dev/preview.md): its own name, data folder and single-instance key; no updater, no sweep.
preview = []
# UIAutomation sees the controls (AccessKit): the real-input test (.github/workflows/rust-input.yml) builds with it.
a11y = ["slint/accessibility"]

[dependencies]
slint = { version = "1.14", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "software-renderer-systemfonts",
    "raw-window-handle-06",
    # winit's own window, so the dialogs' frame is taken off in winit's flags (ui_dialogs::place).
    "unstable-winit-030",
] }
raw-window-handle = "0.6"
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
data = { path = "../data" }
lobby = { path = "../lobby" }
win = { path = "../win" }
common = { path = "../common" }
pipeline = { path = "../pipeline" }
overlay = { path = "../overlay" }
stage = { path = "../stage" }
wgpu = { version = "25", default-features = false, features = ["wgsl"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
scenes = { path = "../scenes" }
sound = { path = "../sound" }
opencv = { version = "0.102", default-features = false, features = ["imgproc", "imgcodecs"] }
caseless = "0.2"
pinyin = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[build-dependencies]
slint-build = "1.14"

[lints]
workspace = true

[package]
name = "sound"
version = "0.1.0"
edition.workspace = true

[dependencies]
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "mkv", "vorbis", "alac", "adpcm"] }

# Playback is Windows only, as the app is; it is given decoded samples, so rodio's own decoders stay off.
[target.'cfg(windows)'.dependencies]
rodio = { version = "0.20", default-features = false }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true

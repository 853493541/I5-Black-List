[package]
name = "scenes"
version = "0.1.0"
edition.workspace = true

[dependencies]
# DX12 only on Windows (WARP, its software adapter, is part of it) and WGSL shaders only; Vulkan and GL for the
# Linux tests (rust/README.md: size).
wgpu = { version = "25", default-features = false, features = ["dx12", "wgsl"] }
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ab_glyph = "0.2"
overlay = { path = "../overlay" }
tiny-skia = "0.11"

[target.'cfg(not(windows))'.dependencies]
wgpu = { version = "25", default-features = false, features = ["vulkan", "gles"] }

[lints]
workspace = true

[package]
name = "ocr"
version = "0.1.0"
edition.workspace = true

[dependencies]
num_cpus = "1.17.0"
opencv = { version = "0.102.0", default-features = false, features = ["imgproc", "imgcodecs"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"

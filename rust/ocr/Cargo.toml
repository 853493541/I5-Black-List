[package]
name = "ocr"
version = "0.1.0"
edition.workspace = true

[dependencies]
clipper-sys = "0.8"
num_cpus = "1.17.0"
opencv = { version = "0.102", default-features = false, features = ["imgproc", "imgcodecs"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "ndarray", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
png = "0.17"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[lints]
workspace = true

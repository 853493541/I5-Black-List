[package]
name = "data"
version = "0.1.0"
edition.workspace = true

[dependencies]
caseless = "0.2.2"
regex = "1.13.2"
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.26"
base64 = "0.22"
chrono = "0.4"
ed25519-dalek = "2"
flate2 = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"
